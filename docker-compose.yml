services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventorystock
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventorystock"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Backend API ────────────────────────────────────────────────────────────
  # On first start: runs prisma migrate deploy, seeds admin user + initial sync
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://inventory:inventory_secret@db:5432/inventorystock
      JWT_SECRET: change-me-to-a-long-random-secret-before-production
      SUPPLIER_API_URL: https://dummyjson.com
      PORT: 8000
      FRONTEND_URL: http://localhost:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s    # allow time for migration + initial sync (~194 products) on first run
    restart: unless-stopped

  # ── React Frontend (nginx) ─────────────────────────────────────────────────
  # nginx serves the built React app and proxies /api/* to the backend
  frontend:
    build: ./frontend
    ports:
      - "9000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
