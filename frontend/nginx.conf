# Non-root nginx vhost. Included by the nginx-unprivileged base image's
# main nginx.conf (which sets pid /tmp/nginx.pid and non-root temp paths).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (added to all responses) ─────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm;
    gzip_min_length 1024;

    # ── Proxy /api/* to the backend container ──────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Passthrough for the backend liveness probe (optional convenience).
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # ── SPA fallback: let React Router own client-side routes ──────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
